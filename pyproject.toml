[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eccentric"
version = "2.0.0"
description = "OCR, translation, and speech API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4.0",
  "Pillow>=10.0,<12.0",
  "pytesseract>=0.3.10,<0.4",
  "googletrans==4.0.2",
  "gTTS>=2.5,<3.0",
  "gunicorn>=22,<24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["eccentric*"]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["EastOCR.py", "EastOCRvideo.py", "textDetectRecog.py"]
